<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CAMH Commitment Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;--surface:#FFFFFF;--ink:#1A2B3C;--muted:#4F5D6B;--line:#D8E2EA;--soft:#EEF3F7;
  --teal:#0072BC;--teal2:#1CABE2;--tealL:#E6F4FB;--tealB:#9DD3EE;--tealM:#1CABE2;
  --amber:#E35F14;--amberL:#FEF0E7;--amberB:#F7C3A2;--amberT:#A8410A;--plum:#6A1E74;
  --grey:#DDE3E8;--sea:#F2F7FB;--head:#003F72;--headT:#FFFFFF;--headM:#CFE3F2;--warn:#C2410C;
  --no:#F9C9A8;--unsure:#DDE3E8;--heading:#003F72;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1620;--surface:#15212E;--ink:#E6EDF3;--muted:#A3B1BF;--line:#26384A;--soft:#1E2D3D;
    --teal:#5BC0EB;--teal2:#1CABE2;--tealL:#11324A;--tealB:#1F5A80;--tealM:#1CABE2;
    --amber:#F28C4E;--amberL:#3A2414;--amberB:#6B3A1C;--amberT:#F6B48A;--plum:#B57BC0;
    --grey:#2A3A4A;--sea:#132433;--head:#06243F;--headT:#FFFFFF;--headM:#A9C6DE;--warn:#F28C4E;
    --no:#6B3A1C;--unsure:#2A3A4A;--heading:#E6EDF3;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1620;--surface:#15212E;--ink:#E6EDF3;--muted:#A3B1BF;--line:#26384A;--soft:#1E2D3D;
    --teal:#5BC0EB;--teal2:#1CABE2;--tealL:#11324A;--tealB:#1F5A80;--tealM:#1CABE2;
    --amber:#F28C4E;--amberL:#3A2414;--amberB:#6B3A1C;--amberT:#F6B48A;--plum:#B57BC0;
    --grey:#2A3A4A;--sea:#132433;--head:#06243F;--headT:#FFFFFF;--headM:#A9C6DE;--warn:#F28C4E;
    --no:#6B3A1C;--unsure:#2A3A4A;--heading:#E6EDF3;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans',Arial,Helvetica,sans-serif;font-size:16px;line-height:1.45}
a{color:var(--teal)}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,path:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.serif{font-family:'Noto Sans',Arial,Helvetica,sans-serif}
.muted{color:var(--muted)}
.wrap{max-width:1312px;margin:0 auto;padding:0 32px}
@media (max-width:700px){.wrap{padding:0 16px}}

/* header */
.site-head{background:var(--head);position:sticky;top:0;z-index:10}
.site-head .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;color:var(--headT);text-decoration:none;font-family:'Noto Sans',Arial,Helvetica,sans-serif;font-size:19px;font-weight:600}
.nav{display:flex;gap:24px;align-items:center;font-size:15px;flex-wrap:wrap}
.nav a{color:var(--headM);text-decoration:none;padding:20px 0 18px;border-bottom:2px solid transparent}
.nav a[aria-current="page"]{color:#fff;font-weight:700;border-bottom-color:#1CABE2}
.nav .cta{background:#1CABE2;color:#00223F;padding:9px 14px;border-radius:8px;font-weight:600;border:0}
@media (max-width:760px){.nav{gap:14px;font-size:14px;padding-bottom:10px}.nav a{padding:6px 0}}

/* layout */
main{padding-bottom:40px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;border-top:4px solid var(--teal2)}
.lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--muted)}
h1,h2,h3{margin:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.span2{grid-column:span 2}
@media (max-width:1000px){.g3,.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.g3 .span2{grid-column:span 2}}
@media (max-width:700px){.g2,.g3,.g4,.g5{grid-template-columns:minmax(0,1fr)}.span2,.g3 .span2{grid-column:auto}}
.pad{padding:24px}
@media (max-width:700px){.pad{padding:18px}}
.section{margin-top:16px}
.h2{font-family:'Noto Sans',Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;line-height:1.25;color:var(--heading)}
.sub{font-size:14px;color:var(--muted);margin-top:4px}
.kpi{padding:20px 22px;display:flex;flex-direction:column;gap:4px}
.kpi b{font-family:'Noto Sans',Arial,Helvetica,sans-serif;font-size:42px;font-weight:800;line-height:1.1;color:var(--teal)}
.kpi b small{font-size:20px;color:var(--muted);font-weight:500}
.kpi span{font-size:14px;color:var(--muted)}
.callout{background:var(--amberL);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.5}
.callout.cool{background:var(--sea)}

/* bars */
.bars{display:flex;flex-direction:column;gap:13px;font-size:14px}
.bar-row{display:grid;grid-template-columns:170px minmax(0,1fr) 48px;gap:12px;align-items:center}
.bar-row .n{font-weight:600;text-align:right}
.bar-row .n.zero{color:var(--warn)}
.bar-row .cap{display:flex;flex-direction:column;gap:1px}
.bar-row .cap small{font-size:12px;color:var(--muted)}
.track{height:14px;background:var(--soft);border-radius:2px;overflow:hidden}
.fill{height:100%;background:var(--teal);border-radius:2px}
@media (max-width:420px){.bar-row{grid-template-columns:120px minmax(0,1fr) 42px}}
.stack{display:flex;height:28px;border-radius:6px;overflow:hidden;font-size:13px;font-weight:600}
.stack div{display:flex;align-items:center;padding-left:10px;min-width:0}
.yes{background:var(--teal);color:#fff}
.no{background:var(--no);color:var(--ink)}
.unsure{background:var(--unsure);color:var(--ink)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;align-items:center}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:6px;vertical-align:-2px}

/* stage cells */
.strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:900px){.strip{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:480px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}
.st{border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-height:70px}
.st .l{font-size:11px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.st .v{font-size:15px;font-weight:600}
.st .d{font-size:12px;color:var(--muted);line-height:1.4}
.st-done{background:var(--tealL);border:1px solid var(--tealB)}
.st-prog{background:var(--amberL);border:1px solid var(--amber)}
.st-na{background:transparent;border:1px dashed var(--grey)}
.st-na .v{font-weight:500;color:var(--muted)}
.glance{background:var(--head);color:var(--headT);border-radius:4px;padding:28px}
.glance .h2{color:#fff}
.glance .st-na{border-color:#4F7AA0}
.glance .st{min-height:100px;padding:14px}
.glance .st .v{font-size:18px}
.glance .st-done{background:var(--tealM);border-color:var(--tealM)}
.glance .st-done .l,.glance .st-done .d,.glance .st-done .v,.glance .st-done a{color:#00223F}
.glance .st-prog{background:#FEF0E7;border:2px solid #E35F14}
.glance .st-prog .l,.glance .st-prog .d,.glance .st-prog .v,.glance .st-prog a{color:#1C2430}
.glance .st-na{border-color:#6B7684}
.glance .st-na .l,.glance .st-na .v{color:#C9D1D9}

/* chips/pills */
.pill{display:inline-block;padding:5px 10px;border-radius:999px;font-size:13px;background:var(--sea)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11px;font-weight:600;padding:4px 8px;border-radius:4px;white-space:nowrap}
.c-done{background:var(--teal);color:#fff}
.c-prog{background:var(--surface);border:2px solid var(--amber);color:var(--ink);padding:2px 6px}
.badge{font-weight:700;background:var(--teal);color:#fff;padding:3px 8px;border-radius:3px;font-size:13px}
.ans{font-weight:600;padding:4px 10px;border-radius:6px;font-size:13px}
.ans.yes{background:var(--teal);color:#fff}
.oc{padding:6px 12px;border-radius:999px;background:var(--sea);border:1px solid var(--tealB);font-size:14px}

/* forms */
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
.fsel{height:44px;border-radius:8px;border:1px solid var(--line);padding:0 12px;font:inherit;font-size:15px;font-weight:400;background:var(--surface);color:var(--ink);width:100%}
textarea.fsel{height:120px;padding:10px 12px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:3px;font:inherit;font-size:15px;font-weight:600;text-decoration:none;cursor:pointer;border:1px solid var(--teal);background:var(--surface);color:var(--teal)}
.btn.primary{background:var(--teal);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0B0F14}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0B0F14}}
.btn.ghost{border-color:var(--line);color:var(--ink);font-weight:500}
.filters{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(5,minmax(0,1fr));gap:12px;align-items:end;padding:18px 20px}
@media (max-width:1100px){.filters{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.filters{grid-template-columns:minmax(0,1fr)}}

/* activity table */
.atable{display:flex;flex-direction:column;border-top:1px solid var(--soft);padding-top:12px}
.arow{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1.6fr) minmax(0,1.3fr) minmax(0,1.1fr);gap:16px;padding:12px 0;border-top:1px solid var(--soft);align-items:center;font-size:14px}
.arow.head{border-top:0;padding-top:0}
@media (max-width:800px){.arow{grid-template-columns:minmax(0,1fr)}.arow.head{display:none}}
.ftable{display:flex;flex-direction:column;overflow-x:auto}
.frow{display:grid;grid-template-columns:minmax(120px,1fr) minmax(160px,1.4fr) minmax(160px,1.5fr) 90px 90px;gap:14px;padding:11px 0;border-top:1px solid var(--soft);font-size:14px;align-items:center;min-width:680px}
.frow.head{border-top:0;padding-top:0}

/* map */
.map svg{display:block;width:100%;height:auto;background:var(--sea);border-radius:10px}
.map .land{fill:var(--grey);stroke:var(--surface);stroke-width:.5}
.map .has{fill:var(--teal2);stroke:#fff;stroke-width:.8;cursor:pointer}
.map .has:hover,.map .has:focus{fill:var(--teal)}
.map .dot{fill:var(--amber);stroke:#fff;stroke-width:2;cursor:pointer}
.map .lead{stroke:var(--ink);stroke-width:1;fill:none}
.map text{fill:var(--ink);font-family:'Noto Sans',Arial,sans-serif}
.map .num{fill:#1C2430;font-size:12px;font-weight:700;text-anchor:middle;pointer-events:none}
.tooltip{position:fixed;pointer-events:none;background:var(--head);color:#fff;font-size:13px;padding:8px 10px;border-radius:8px;display:none;z-index:20;max-width:240px}

.crumb{font-size:14px;color:var(--muted);padding-top:28px}
.foot{margin-top:40px;border-top:1px solid var(--line);padding:24px 0;font-size:13px;color:var(--muted)}
.foot .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.empty{text-align:center;padding:48px 24px}
.tag-demo{background:var(--amberL);color:var(--amberT);font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--head);color:#fff;padding:12px 16px;border-radius:10px;font-size:14px;z-index:30;display:none}
@media (prefers-reduced-motion: no-preference){.expand{animation:open .18s ease-out}@keyframes open{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}}
</style>
</head>

/* ---------- helpers ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=(n,d)=>d?Math.round(n/d*100):0;
const allActs=()=>DATA.flatMap(c=>c.activities.map(a=>({...a,c})));
function stageOf(a,k){
  if(k==='budget'){
    if(a.funding.length) return {s:'done',v:'Confirmed',d:[...new Set(a.funding.map(f=>f.date).filter(Boolean))].join(' · '),t:a.funding.length>1?a.funding.length+' funders':a.funding[0].funder};
    return null;
  }
  return a.stages[k]||null;
}
function aggStage(c,k){
  const n=c.activities.length;
  const hits=c.activities.map(a=>stageOf(a,k)).filter(Boolean);
  if(!hits.length) return null;
  const best=hits.find(h=>h.s==='done')||hits[0];
  const s=hits.some(h=>h.s==='done')?'done':'prog';
  let d= n>1 ? `${hits.length} of ${n} activities` : [best.d,best.t].filter(Boolean).join(' · ');
  return {s,v:best.v,d,l:n===1?best.l:null};
}
function stCell(x,label,linkTitle){
  if(!x) return `<div class="st st-na"><span class="l">${label}</span><span class="v">Not available</span></div>`;
  const tail = x.l && linkTitle!==false ? `${esc(x.d||'')}${x.d?' · ':''}<a href="${esc(x.l)}" target="_blank" rel="noopener">${esc(x.t||'Source')} ↗</a>` : esc([x.d,x.t].filter(Boolean).join(' · '));
  return `<div class="st st-${x.s}"><span class="l">${label}</span><span class="v">${esc(x.v)}</span><span class="d">${tail}</span></div>`;
}
const chipsFor=a=>STAGES.map(([k,,sh])=>{const x=stageOf(a,k);return x?`<span class="chip c-${x.s}">${esc(sh)}</span>`:''}).join('');
const fundTypes=a=>a.funding.length?[...new Set(a.funding.map(f=>f.type))]:[a.noFunding==='na'?'Not available':'No funding reported'];
const reached=(a,k)=>!!stageOf(a,k);
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',3200)}
function barRow(name,n,d,unit,color){
  const w=d?n/d*100:0;
  return `<div class="bar-row"><span class="cap"><span>${esc(name)}</span><small>${n} of ${d} ${unit}</small></span><div class="track" role="img" aria-label="${esc(name)}: ${n} of ${d}"><div class="fill" style="width:${w.toFixed(1)}%${color?';background:'+color:''}"></div></div><span class="n${n?'':' zero'}">${pct(n,d)}%</span></div>`;
}
function outcomeBars(acts){
  const rows=OUTCOMES.map(([k,name])=>[name,acts.filter(a=>a.outcomes.includes(k)).length]).sort((a,b)=>b[1]-a[1]);
  const gaps=rows.filter(r=>!r[1]).map(r=>r[0].toLowerCase());
  return `<div class="bars">${rows.map(r=>barRow(r[0],r[1],acts.length,'activities')).join('')}</div>`+
    (gaps.length?`<div class="callout">No activity yet addresses ${gaps.length>1?gaps.slice(0,-1).join(', ')+' or '+gaps.slice(-1):gaps[0]}.</div>`:'');
}
function stageBars(acts){
  return `<div class="bars">${STAGES.map(([k,name])=>barRow(name,acts.filter(a=>reached(a,k)).length,acts.length,'activities')).join('')}</div>`;
}
function fundingBars(acts){
  const streams=acts.flatMap(a=>a.funding.length?a.funding.map(f=>f.type):[a.noFunding==='na'?'Not available':'No budget reported']);
  const cols={'Domestic public':'var(--teal)','Multilateral donor':'var(--amber)','Int’l NGO / philanthropy':'var(--plum)','No budget reported':'#B9B4A8','Not available':'var(--grey)'};
  const keys=Object.keys(cols).filter(k=>streams.includes(k));
  return {html:`<div class="bars">${keys.map(k=>barRow(k,streams.filter(s=>s===k).length,streams.length,'funding streams',cols[k])).join('')}</div>`,n:streams.length,streams};
}

function mapSvg(){
  const lab={GB:{x:336,y:60,a:'end',lx:340,ly:70},RW:{x:416,y:296,a:'end',lx:420,ly:290},MY:{x:640,y:306,a:'start',lx:664,ly:292}};
  let h=`<svg viewBox="0 0 860 430" role="img" aria-label="World map of countries with commitments: ${Object.values(COUNTRIES).map(c=>c.name).join(', ')}"><path class="land" d="${MAP.grey}"/>`;
  for(const iso of Object.keys(MAP.col)){
    const c=MAP.col[iso],cn=DATA.filter(d=>d.iso===iso).length,an=DATA.filter(d=>d.iso===iso).reduce((s,d)=>s+d.activities.length,0),L=lab[iso];
    h+=`<path class="has" d="${c.d}" data-iso="${iso}" tabindex="0" role="link" aria-label="${esc(COUNTRIES[iso].name)}: ${cn} commitments"/>`;
    h+=`<line class="lead" x1="${c.c[0]}" y1="${c.c[1]}" x2="${L.lx}" y2="${L.ly}"/>`;
    h+=`<circle class="dot" cx="${c.c[0]}" cy="${c.c[1]}" r="${8+cn*3.5}" data-iso="${iso}"/><text class="num" x="${c.c[0]}" y="${c.c[1]+4}">${cn}</text>`;
    h+=`<text x="${L.x}" y="${L.y}" text-anchor="${L.a}" font-size="14" font-weight="600">${esc(COUNTRIES[iso].name)}</text><text x="${L.x}" y="${L.y+16}" text-anchor="${L.a}" font-size="12">${cn} commitment${cn>1?'s':''} · ${an} activit${an>1?'ies':'y'}</text>`;
  }
  return h+'</svg>';
}

/* commitments list */
const F={q:'',country:'',stage:'',funder:'',outcome:'',target:''};
const OPEN=new Set(['1_RW']);
function actMatches(a,c){
  if(F.country&&c.iso!==F.country) return false;
  if(F.stage&&!reached(a,F.stage)) return false;
  if(F.funder){ if(F.funder==='none'){ if(a.funding.length) return false;} else if(!a.funding.some(f=>f.type===F.funder)) return false; }
  if(F.outcome&&!a.outcomes.includes(F.outcome)) return false;
  if(F.target&&a.target!==F.target) return false;
  if(F.q){const t=[c.title,c.entity,COUNTRIES[c.iso].name,a.title,a.desc,...a.funding.map(f=>f.funder+' '+f.type)].join(' ').toLowerCase(); if(!t.includes(F.q.toLowerCase())) return false;}
  return true;
}

  if(kind==='methodology') return `<section class="wrap" style="padding:56px 32px;max-width:820px"><span class="tag-demo">Placeholder</span><h1 class="serif" style="font-size:40px;font-weight:600;margin-top:14px">Methodology</h1><p class="muted" style="font-size:17px;line-height:1.6">[How commitments are identified, how each action status is verified from public sources, how funding streams are counted, and how outcome areas and sustainability are coded.]</p><h2 class="h2" style="margin-top:28px">Action statuses</h2><div class="strip" style="margin-top:14px">${STAGES.map(([,n])=>`<div class="st st-done"><span class="v">${n}</span></div>`).join('')}</div></section>`;
  if(kind==='submit') {
    const pre=(location.hash.split('c=')[1]||'');
    return `<section class="wrap" style="padding:48px 32px;max-width:760px"><h1 class="serif" style="font-size:40px;font-weight:600">Submit an update</h1><p class="muted" style="font-size:17px;line-height:1.55">Tell us about a new commitment, budget, implementation report or evaluation. We review every submission before it appears on the tracker.</p>
    <form class="card pad" id="submitForm" style="display:flex;flex-direction:column;gap:16px;margin-top:20px">
      <label class="f">Commitment<select class="fsel" name="commitment"><option value="">A new commitment</option>${DATA.map(c=>opt(c.id,`${COUNTRIES[c.iso].name}: ${c.title}`,pre)).join('')}</select></label>
      <label class="f">Action status this relates to<select class="fsel" name="stage">${STAGES.map(([k,n])=>opt(k,n,'')).join('')}</select></label>
      <label class="f">Link to the source<input class="fsel" type="url" name="link" required placeholder="https://"></label>
      <label class="f">What has changed?<textarea class="fsel" name="note" required placeholder="For example: the 2026 budget confirms funding for the schools programme."></textarea></label>
      <label class="f">Your email (optional)<input class="fsel" type="email" name="email"></label>
      <button class="btn primary" type="submit" style="align-self:flex-start">Submit update</button>
    </form></section>`;
  }
}
function vNotFound(){return `<section class="wrap empty"><h1 class="h2">Page not found</h1><p class="muted">This commitment or country isn’t in the tracker yet.</p><a class="btn primary" href="#/">Go to the overview</a></section>`}

/* CSV */
function csvFor(ids){
  const head=['Commitment ID','Country','Commitment','Activity','Target population',...STAGES.map(s=>s[1]+' status'),'Funding type','Funder','Budget title','Budget date','Outcome areas','Ongoing','Multisectoral','Embedded'];
  const rows=[head];
  DATA.filter(c=>!ids||ids.includes(c.id)).forEach(c=>c.activities.forEach(a=>{
    const fs=a.funding.length?a.funding:[{type:fundTypes(a)[0],funder:'',title:'',date:''}];
    fs.forEach(f=>rows.push([c.id,COUNTRIES[c.iso].name,c.title,a.title,a.target,...STAGES.map(([k])=>(stageOf(a,k)||{}).v||'Not available'),f.type,f.funder,f.title,f.date,a.outcomes.map(k=>OUTCOMES.find(o=>o[0]===k)[1]).join('; '),...a.sustain]));
  }));
  return rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
}
function downloadCsv(id){
  try{
    const blob=new Blob([csvFor(id?[id]:null)],{type:'text/csv'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(id||'camh-commitments')+'.csv';document.body.appendChild(a);a.click();a.remove();
    toast('Download started. If nothing happens, open this page in its own browser tab.');
  }catch(e){toast('Download isn’t available in this view.')}
}

/* ---------- router ---------- */
function route(){
  const h=location.hash.replace(/^#\/?/,'').split('?')[0];
  const [p,arg]=h.split('/');
  const app=document.getElementById('app');
  let nav='overview';
  if(!p){app.innerHTML=vOverview();}
  else if(p==='commitments'){nav='commitments';app.innerHTML=vCommitments();renderResults();}
  else if(p==='commitment'){nav='commitments';app.innerHTML=vCommitment(arg);}
  else if(p==='country'){nav='country';app.innerHTML=vCountry(arg);}
  else if(['report','methodology','submit'].includes(p)){nav=p;app.innerHTML=vPage(p);}
  else app.innerHTML=vNotFound();
  document.querySelectorAll('[data-nav]').forEach(a=>{if(a.dataset.nav===nav)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  window.scrollTo(0,0);
  app.focus({preventScroll:true});
}
window.addEventListener('hashchange',route);

document.addEventListener('input',e=>{
  const f=e.target.closest('#filters'); if(!f) return;
  F[e.target.name]=e.target.value; renderResults();
});
document.addEventListener('change',e=>{
  if(e.target.closest('#filters')){F[e.target.name]=e.target.value;renderResults();}
  if(e.target.id==='cswitch') location.hash='#/country/'+e.target.value;
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(b){
    const act=b.dataset.act;
    if(act==='toggle'){const id=b.dataset.id;OPEN.has(id)?OPEN.delete(id):OPEN.add(id);renderResults();const nb=document.querySelector(`[data-act="toggle"][data-id="${id}"]`);nb&&nb.focus();}
    if(act==='clear'){Object.keys(F).forEach(k=>F[k]='');const app=document.getElementById('app');app.innerHTML=vCommitments();renderResults();}
    if(act==='csv') downloadCsv(b.dataset.id);
    if(act==='soon') toast('The report will be available here once it’s published.');
    return;
  }
  const m=e.target.closest('.map [data-iso]'); if(m) location.hash='#/country/'+m.dataset.iso;
});
document.addEventListener('keydown',e=>{
  const m=e.target.closest&&e.target.closest('.map [data-iso]');
  if(m&&(e.key==='Enter'||e.key===' ')){e.preventDefault();location.hash='#/country/'+m.dataset.iso;}
});
document.addEventListener('submit',e=>{
  if(e.target.id==='submitForm'){e.preventDefault();e.target.outerHTML=`<div class="card pad" style="margin-top:20px"><h2 class="h2">Update received</h2><p class="muted">Thanks — in this prototype nothing is sent, but in the live site your update would go to the review team.</p><a class="btn primary" href="#/commitments">Back to commitments</a></div>`;}
});
/* map tooltip */
const tip=document.getElementById('tip');
document.addEventListener('mousemove',e=>{
  const m=e.target.closest&&e.target.closest('.map [data-iso]');
  if(!m){tip.style.display='none';return;}
  const iso=m.dataset.iso,cs=DATA.filter(d=>d.iso===iso);
  tip.innerHTML=`<strong>${esc(COUNTRIES[iso].name)}</strong><br>${cs.map(c=>esc(c.title)).join('<br>')}<br><span style="opacity:.8">Select to view snapshot</span>`;
  tip.style.display='block';tip.style.left=Math.min(e.clientX+14,innerWidth-260)+'px';tip.style.top=(e.clientY+14)+'px';
});
route();
</script>
</body>
</html>
